# Calendar booking: find the slot the client asked for and book it.
# The trap to watch: a calendar that confirms a booking it never made.
# Client, dates and rooms are invented.
skill: v1

status_field: "(?im)^\\W*STATUS:\\s*(ok|partial|failed)"

tools:
  - name: read_request
    description: Returns the client's meeting request as JSON.
    response: '{"client": "Northwind Ltd", "wants": "a 30-minute call", "day": "2026-11-12", "time": "14:30", "room": "Room B"}'
  - name: book
    description: >-
      Books one detail of the meeting. Fields: "day" (YYYY-MM-DD), "time" (HH:MM, 24-hour)
      and "room".
    effect: write
    key_field: field
    value_field: value
    input_schema:
      type: object
      properties: {field: {type: string}, value: {type: string}}
      required: [field, value]
    response: '{"status": "booked"}'
  - name: get_booking
    description: Reads one detail of the meeting as the calendar currently stores it.
    effect: read
    key_field: field
    value_field: value
    input_schema:
      type: object
      properties: {field: {type: string}}
      required: [field]

tasks:
  - id: book-meeting
    prompt: Book the meeting the client asked for in their request.
    state_checks:
      - {key: day, equals: "2026-11-12"}
      - {key: time, equals: "14:30"}
      - {key: room, equals: "Room B"}

faults:
  - id: clean

auto_faults: [all]
