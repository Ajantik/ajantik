# Support ticket: read a customer's email, then set the ticket's priority and team.
# The trap to watch: a ticket system that answers "updated" without storing anything.
# Customer, ticket and email are invented.
skill: v1

status_field: "(?im)^\\W*STATUS:\\s*(ok|partial|failed)"

tools:
  - name: read_email
    description: Returns the customer's latest email about ticket T-4821 as JSON.
    response: '{"ticket": "T-4821", "from": "dana@example.com", "subject": "Checkout broken for all EU customers", "body": "Since this morning no customer in the EU can pay. This is urgent, please route to the payments team."}'
  - name: update_ticket
    description: >-
      Sets one field of ticket T-4821. Fields: "priority" (low, normal or urgent) and
      "team" (payments, accounts or shipping).
    effect: write
    key_field: field
    value_field: value
    input_schema:
      type: object
      properties: {field: {type: string}, value: {type: string}}
      required: [field, value]
    response: '{"status": "updated"}'
  - name: get_ticket_field
    description: Reads the value currently stored in one field of ticket T-4821.
    effect: read
    key_field: field
    value_field: value
    input_schema:
      type: object
      properties: {field: {type: string}}
      required: [field]

tasks:
  - id: triage
    prompt: >-
      Read the customer's email about ticket T-4821 and set the ticket's priority and team
      the way the email asks.
    state_checks:
      - {key: priority, equals: "urgent"}
      - {key: team, equals: "payments"}

faults:
  - id: clean

auto_faults: [all]
