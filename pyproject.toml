[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ajantik"
version = "0.6.0"
description = "A crash test for AI agents: what does your agent tell you when its tools lie or fail?"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Berk Kaynas" }]
keywords = ["ai-agents", "evaluation", "fault-injection", "mcp", "llm", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=1.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "websockets>=15.0",
]

[project.urls]
Homepage = "https://github.com/Ajantik/ajantik"
Repository = "https://github.com/Ajantik/ajantik"
Issues = "https://github.com/Ajantik/ajantik/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ajantik = "ajantik.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ajantik"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
