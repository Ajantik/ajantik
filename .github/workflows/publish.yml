# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed. No token is stored anywhere:
# PyPI trusts this workflow through OpenID Connect ("trusted publishing"). The PyPI project
# must list Ajantik/ajantik, workflow publish.yml, environment pypi as a trusted publisher.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
